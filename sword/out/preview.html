CLIPS.forEach((c, i) => sel.add(new Option(c.name + (c.loop ? " (loop)" : ""), i)));
let clip = CLIPS[0], t = 0, playing = true, freezeUntil = 0;
function choose(i) {
  clip = CLIPS[i]; t = 0; scrub.max = clip.frames.length - 1;
  const limb = LIMB[clip.limb];
  if (limb) {
    const pts = clip.frames.map(f => tipOf(f, limb));
    trailGeo.setFromPoints(pts);
    rig[limb].material.emissive = new THREE.Color(0x000000);
  } else trailGeo.setFromPoints([]);
}
sel.onchange = () => choose(+sel.value);
document.getElementById("play").onclick = () => { playing = !playing; document.getElementById("play").textContent = playing ? "Pause" : "Play"; };
scrub.oninput = () => { playing = false; document.getElementById("play").textContent = "Play"; t = +scrub.value / clip.fps; };
addEventListener("keydown", e => {
  if (e.code === "Space") { document.getElementById("play").click(); e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") { playing = false; t = Math.max(0, t + (e.code === "ArrowRight" ? 1 : -1) / clip.fps); }
});

let yaw = -Math.PI / 2, pitch = 0.15, dist = 15, drag = null;
const views = { side: [-Math.PI / 2, 0.12], front: [0, 0.12], three: [-Math.PI / 4, 0.3], top: [-Math.PI / 2, 1.3] };
document.getElementById("cam").onchange = e => { [yaw, pitch] = views[e.target.value]; };
canvas.onpointerdown = e => { drag = [e.clientX, e.clientY, yaw, pitch]; canvas.setPointerCapture(e.pointerId); };
canvas.onpointermove = e => { if (!drag) return; yaw = drag[2] - (e.clientX - drag[0]) * 0.01; pitch = Math.max(-0.2, Math.min(1.45, drag[3] + (e.clientY - drag[1]) * 0.01)); };
canvas.onpointerup = () => drag = null;
canvas.onwheel = e => { dist = Math.max(5, Math.min(40, dist * (1 + Math.sign(e.deltaY) * 0.1))); e.preventDefault(); };

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const n = clip.frames.length, len = (n - 1) / clip.fps;
  const hitMarker = clip.markers.find(m => m.name === "Hit");
  if (playing && now >= freezeUntil) {
    const before = t;
    t += dt * +document.getElementById("speed").value;
    if (hitMarker && document.getElementById("stop").checked && before < hitMarker.frame / clip.fps && t >= hitMarker.frame / clip.fps) {
      t = hitMarker.frame / clip.fps;
      freezeUntil = now + clip.hitstop * 1000 / +document.getElementById("speed").value;
    }
    if (t > len) t = clip.loop ? t % len : (t > len + 0.5 ? 0 : len);
  }
  if (!(t >= 0)) t = 0;
  const fi = Math.max(0, Math.min(n - 1, Math.round(t * clip.fps)));
  apply(rig, clip.frames[fi]);
  const showGhost = document.getElementById("ghost").checked;
  ghosts.forEach((g, k) => { const gi = Math.max(0, fi - (k + 1) * 3); for (const p in g) g[p].visible = showGhost; if (showGhost) apply(g, clip.frames[gi]); });
  trail.visible = document.getElementById("trail").checked;
  const near = clip.markers.find(m => Math.abs(m.frame - fi) <= 0);
  flag.textContent = near ? near.name : "";
  const limb = LIMB[clip.limb];
  if (limb) rig[limb].material.emissive = new THREE.Color(hitMarker && Math.abs(hitMarker.frame - fi) <= 1 ? 0x661111 : 0x000000);
  scrub.value = fi;
  info.textContent = `frame ${fi}/${n - 1}  ·  ${(fi / clip.fps).toFixed(3)} s  ·  ${clip.markers.map(m => m.name + "@" + m.frame).join(" ")}`;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist - 0.5, Math.cos(yaw) * Math.cos(pitch) * dist - 1.5);
  camera.lookAt(0, -0.5, -1.5);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
choose(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
